name: Mirror Content from design-system

on:
  schedule:
    # Run every day at 2:00 AM UTC
    - cron: '0 1 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build:

    runs-on: ubuntu-latest
    if: github.repository_owner == 'canada-ca'

    steps:
      - name: Checkout Main repo
        uses: actions/checkout@v7
        with:
          repository: canada-ca/design-system
          path: english
          ref: master
      - name: Checkout French mirror
        uses: actions/checkout@v7
        with:
          path: french
          ref: master
      - name: Copy GitHub Actions
        run: cp -r english/.github/workflows/ french/.github/workflows/
      - name: Copy Ruby setup
        run: |
          cp -r english/Gemfile* french/
          cp -r english/.ruby-version french/
      - name: Push back changes to French repo
        run: |
          cd french
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync Action" || true
          git push
